query_id:
  type: integer
  default: 7
  description: "The Data Explorer query \"Member activity\" (query.sql in the repo). Its columns must stay as they are."
staff_group:
  type: string
  default: "staff"
  description: "The group the query is shared with. Only its members can run it."
rp_categories:
  type: list
  list_type: category
  default: "17|18|19|20|21|22"
  description: "The RP categories. Their subcategories count too."
default_months:
  type: integer
  default: 3
  min: 1
  max: 24
  description: "The period the chart opens on, in months of 30 days (3 months is 90 days)."
max_months:
  type: integer
  default: 24
  min: 1
  max: 120
  description: "The longest period the + button reaches."
